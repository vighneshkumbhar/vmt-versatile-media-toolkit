<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>VMT Developer Portal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="header">
    <div style="font-weight: bold; font-size: 1.2rem;">VMT Developer Portal</div>
    <div>
      <span id="user-display" style="margin-right: 1rem;"></span>
      <button onclick="logout()">Logout</button>
    </div>
  </header>

  <div class="dashboard-layout">
    <div class="sidebar">
      <a class="sidebar-item active" href="#">My Extensions</a>
      <a class="sidebar-item" href="#" onclick="openUploadModal()">Upload New Extension</a>
      <a class="sidebar-item" href="https://github.com" target="_blank">Documentation</a>
    </div>

    <div class="main-content">
      <div id="extensions-container">
        <!-- Extensions will be loaded here -->
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="upload-modal">
    <div class="modal">
      <h2 id="upload-title">Upload Extension</h2>
      <div id="upload-error" class="error-banner"></div>
      <form id="upload-form">
        <div class="form-group">
          <label>Select .vmte file</label>
          <input type="file" id="ext-file" accept=".vmte" required>
        </div>
        <div id="file-info" style="margin-bottom: 1rem; color: var(--text-muted); font-size: 0.875rem;"></div>
        <div style="display: flex; gap: 1rem;">
          <button type="submit" id="upload-btn">Upload</button>
          <button type="button" style="background: var(--bg-card-alt);" onclick="closeUploadModal()">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <div id="toast" class="toast">Extension uploaded successfully</div>

  <script src="app.js"></script>
</body>
</html>
