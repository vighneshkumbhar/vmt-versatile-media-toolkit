<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VMT Admin Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="dashboard">
    <header class="header">
      <div class="header-brand">VMT Admin Portal</div>
      <div class="header-user">
        <span id="current-username">Admin</span>
        <button id="logout-btn">Logout</button>
      </div>
    </header>

    <div class="main-container">
      <aside class="sidebar">
        <div class="nav-item active" data-view="pending">
          <span>🔍 Pending Review</span>
          <span class="badge" id="pending-badge">0</span>
        </div>
        <div class="nav-item" data-view="all">
          <span>🧩 All Extensions</span>
        </div>
        <div class="nav-item" data-view="users">
          <span>👤 Users</span>
        </div>
      </aside>

      <main class="content">
        <!-- Pending View -->
        <div id="view-pending" class="view active">
          <h2>Pending Review</h2>
          <div id="pending-list">
            Loading...
          </div>
        </div>

        <!-- All Extensions View -->
        <div id="view-all" class="view">
          <h2>All Extensions</h2>
          <table id="all-ext-table">
            <thead>
              <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Status</th>
                <th>Downloads</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="all-ext-list">
            </tbody>
          </table>
        </div>

        <div id="view-users" class="view">
          <h2>Users</h2>
          <p>Not implemented yet.</p>
        </div>

        <!-- Review Panel -->
        <div id="review-panel" class="review-panel">
          <button class="back-btn" id="close-review">← Back to Queue</button>
          <div id="review-content"></div>
        </div>
      </main>
    </div>
  </div>
  
  <div id="toast-container" class="toast-container"></div>
  
  <script src="app.js"></script>
</body>
</html>
